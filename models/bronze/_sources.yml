version: 2
sources:
  - name: oyu_app
    description: >
      Oyu app-ийн SingleStore database. Prod: OYU_SRC_DB=<app db>, OYU_SRC_PREFIX=''.
      Demo: seeds (raw_*) dwh database дотор ачаалагдана.
    database: oyu_kids
    schema: oyu_kids   # SingleStore-д үл хэрэглэгдэнэ
    tables:
      - { name: users,             identifier: users }
      - { name: passages,          identifier: passages }
      - { name: poems,             identifier: poems }
      - { name: classrooms,        identifier: classrooms }
      - { name: memberships,       identifier: memberships }
      - { name: assignments,       identifier: assignments }
      - { name: word_rounds,       identifier: word_rounds }
      - { name: attempts,          identifier: attempts }
      - { name: guardian_consents, identifier: guardian_consents }
